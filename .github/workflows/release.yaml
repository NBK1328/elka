name: Release
on:
  push:
    tags:
      - 'v*'

# The tag is the version, and it is the only place one exists: vpk is handed
# `${{ env.VERSION }}` by all three packaging jobs and nothing else ever set it, so
# each installer was being packed with an empty version. The leading `v` is
# stripped where it is used, because vpk wants semver.
env:
  VERSION: ${{ github.ref_name }}

# Each platform packs its own installers with vpk, because that is the only step in this repository
# that can produce a macOS .pkg, an AppImage or an NSIS installer. Only the installers are published:
# vpk also writes *.nupkg (the full package and its delta) and releases.<channel>.json (the channel
# manifest), and those feed Velopack's own updater. Nothing here ever starts it — Run() in
# backend/cmd/elka-desktop/main.go only enables apply-on-startup and never constructs an
# UpdateManager, and the real update path is backend/internal/services/updater, which reads the
# GitHub API and launches the installer below. Those payloads were 42% of the release for nothing.
#
# Publishing moved into one job because vpk upload used to merge three parallel jobs into a single
# release. With gh release create there is no merge, and racing create calls would fail, so the jobs
# hand their installers over as artifacts instead.
jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Build Wails App
        run: wails3 task build
        env:
          CGO_ENABLED: 1

      - name: Package installers
        shell: bash
        run: |
          dotnet tool install -g vpk

          vpk pack \
            --packId "Elka" \
            --packVersion "${VERSION#v}" \
            --packDir "bin" \
            --mainExe "elka.exe" \
            --packTitle "Elka" \
            --packAuthors "Elka" \
            --channel windows-stable \
            --icon "build/windows/icon.ico" \
            --outputDir releases

          rm -f releases/*.nupkg releases/releases.*.json

      - name: Get green checkmark
        uses: actions/attest@v4
        with:
          subject-path: |
            releases/*

      - name: Hand over installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            releases/*.exe
            releases/*.zip
          if-no-files-found: error
          retention-days: 1

  build-linux:
    # Pin jammy: the packages are built here, and a newer glibc would make the
    # .deb require a newer libc than Debian 12 and Ubuntu 22.04 ship.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - uses: ./.github/actions/setup

      - name: Build Wails App
        run: wails3 task build EXTRA_TAGS=gtk3
        env:
          CGO_ENABLED: 1

      - name: Package installers
        shell: bash
        run: |
          dotnet tool install -g vpk

          vpk pack \
            --packId "Elka" \
            --packVersion "${VERSION#v}" \
            --packDir "bin" \
            --mainExe "elka" \
            --packTitle "Elka" \
            --packAuthors "Elka" \
            --channel linux-stable \
            --icon "build/appicon.png" \
            --outputDir releases

          rm -f releases/*.nupkg releases/releases.*.json

      - name: Package DEB and Arch Linux packages
        shell: bash
        env:
          GOARCH: amd64
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.44.1
          mkdir -p releases

          nfpm package -f build/linux/nfpm/nfpm.yaml -p deb -t releases/
          nfpm package -f build/linux/nfpm/nfpm.yaml -p archlinux -t releases/

      - name: Get green checkmark
        uses: actions/attest@v4
        with:
          subject-path: |
            releases/*

      - name: Hand over installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: |
            releases/*.AppImage
            releases/*.deb
            releases/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Build Wails App
        run: wails3 task package
        env:
          CGO_ENABLED: 1

      - name: Package installers
        shell: bash
        run: |
          dotnet tool install -g vpk

          APP_BUNDLE=$(find bin -maxdepth 1 -name "*.app" | head -n 1)

          vpk pack \
            --packId "Elka" \
            --packVersion "${VERSION#v}" \
            --packDir "$APP_BUNDLE" \
            --mainExe "elka" \
            --packTitle "Elka" \
            --packAuthors "Elka" \
            --channel macos-stable \
            --runtime osx-arm64 \
            --icon "build/darwin/icons.icns" \
            --outputDir releases

          rm -f releases/*.nupkg releases/releases.*.json

      - name: Get green checkmark
        uses: actions/attest@v4
        with:
          subject-path: |
            releases/*

      - name: Hand over installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: |
            releases/*.pkg
            releases/*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build-windows, build-linux, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh cannot work out the repository from a git remote and
          # dies with "not a git repository". Naming it explicitly removes the git dependency
          # entirely, which is why there is no checkout step here.
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v${GITHUB_REF_NAME#v}"

          # A tag carrying a pre-release marker becomes a GitHub pre-release, and /releases/latest
          # excludes those. Without this a test build would be offered to every installed copy, and
          # backend/internal/services/updater reads exactly that endpoint.
          prerelease=()
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) prerelease=(--prerelease) ;;
          esac

          # Read into an array with a loop rather than mapfile: that builtin needs bash 4, and the
          # workflow declares no shell version, so relying on it would only work by accident.
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(find installers -type f | sort)

          if [ "${#files[@]}" -ne 7 ]; then
            echo "expected 7 installers, found ${#files[@]}: ${files[*]}" >&2
            exit 1
          fi

          gh release create "$TAG" "${files[@]}" \
            --verify-tag \
            --title "Elka $TAG" \
            --generate-notes \
            "${prerelease[@]}"

          gh release view "$TAG"